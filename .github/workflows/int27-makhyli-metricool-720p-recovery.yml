name: Makhyli INT27 Full-Video Delivery Repair
on:
  push:
    paths:
      - .github/workflows/int27-makhyli-metricool-720p-recovery.yml
permissions:
  contents: write
jobs:
  full-metricool-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: Makhyli_Broll_Full_39m25_2Ads_1080p.mp4
      DST: Makhyli_39m25_2Ads_Metricool_CFR720p.mp4
      RELEASE: makhyli-2026-10-14
    steps:
      - name: Reuse existing output when source worker already uploaded
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE" --json assets --jq '.assets[].name' | grep -Fxq "$DST"; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install FFmpeg if needed
        if: steps.check.outputs.skip == 'false'
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Download authorized already-published FVTV full interview
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o "$SRC" "https://github.com/fvtvmedia/fvtv-public-video-delivery/releases/download/$RELEASE/$SRC"
          test "$(stat -c %s "$SRC")" -eq 410789216
      - name: Make upload-specific CFR720p H264 AAC copy
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$SRC" -map 0:v:0 -map 0:a:0 -vf "scale=1280:720:flags=bicubic,fps=30,format=yuv420p" -c:v libx264 -preset veryfast -crf 28 -maxrate 920k -bufsize 1840k -profile:v high -g 60 -bf 0 -c:a aac -b:a 128k -ar 48000 -movflags +faststart "$DST"
          test -s "$DST"
          test "$(stat -c %s "$DST")" -lt 450000000
          duration=$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$DST")
          awk -v duration="$duration" 'BEGIN { exit !(duration>2364 && duration<2366.5) }'
          ffmpeg -v error -nostdin -i "$DST" -f null /dev/null 2> decode_errors.txt
          test ! -s decode_errors.txt
          sha256sum "$DST"
      - name: Attach to existing public FVTV release exactly once
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE" --json assets --jq '.assets[].name' | grep -Fxq "$DST"; then
            echo 'Already uploaded by original worker. Keeping original.'
          else
            gh release upload "$RELEASE" "$DST" || gh release view "$RELEASE" --json assets --jq '.assets[].name' | grep -Fxq "$DST"
          fi
          gh release view "$RELEASE" --json assets --jq '.assets[] | select(.name == "Makhyli_39m25_2Ads_Metricool_CFR720p.mp4") | {name,size,digest}'
