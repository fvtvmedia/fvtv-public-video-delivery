name: Repair Lord Roka square clip labels
on:
  push:
    paths:
      - '.github/workflows/roka-square-label-repair-20261125.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render from verified original
        run: |
          curl --fail --location --retry 2 'https://static.metricool.com/planner/202611/6530801-file-16140418821302135646.mp4' -o source.mp4
          echo '60173750197274ccd08ef94948e36d51ab0aa58c53f3e1780c144932b3e17de3  source.mp4' | sha256sum -c -
          ffmpeg -v error -i source.mp4 -vf 'drawbox=x=550:y=145:w=530:h=85:color=0x090a0b:t=fill,drawbox=x=716:y=241:w=364:h=11:color=0x090a0b:t=fill' -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p -c:a copy -movflags +faststart LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4
          ffmpeg -v error -ss 28 -i LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4 -frames:v 1 LordRoka_CentralAvenue_Square_NoHostLabel_Thumbnail.jpg
          ffmpeg -v error -xerror -i LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4 -f null -
          ffmpeg -v error -i source.mp4 -map 0:a -c copy -f hash -hash sha256 source_audio.txt
          ffmpeg -v error -i LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4 -map 0:a -c copy -f hash -hash sha256 output_audio.txt
          cmp source_audio.txt output_audio.txt
          ffprobe -v error -show_format -show_streams -of json LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4 > LordRoka_CentralAvenue_Square_NoHostLabel_20261125_QA.json
          sha256sum LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4 LordRoka_CentralAvenue_Square_NoHostLabel_Thumbnail.jpg > LordRoka_CentralAvenue_Square_NoHostLabel_20261125_SHA256.txt
      - name: Deliver to existing original release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lord-roka-2026-10-14-int42 --repo fvtvmedia/fvtv-public-video-delivery
          gh release upload lord-roka-2026-10-14-int42 --repo fvtvmedia/fvtv-public-video-delivery LordRoka_CentralAvenue_Square_NoHostLabel_20261125.mp4 LordRoka_CentralAvenue_Square_NoHostLabel_Thumbnail.jpg LordRoka_CentralAvenue_Square_NoHostLabel_20261125_QA.json LordRoka_CentralAvenue_Square_NoHostLabel_20261125_SHA256.txt
